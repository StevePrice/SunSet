[project]
name = "sunset-scorer"
version = "0.1.0"
description = "Sunset Soul photo scoring service (Palette, Reach, Setting, Wow Factor)."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
