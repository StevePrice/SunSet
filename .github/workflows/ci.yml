name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (lint, typecheck, test, Worker build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # For the data-access tests (entries are private to their owner).
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: sunset_test
          POSTGRES_USER: sunset
          POSTGRES_PASSWORD: sunset
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunset -d sunset_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=@sunset/web
      - run: npm run typecheck --workspace=@sunset/web
      - run: npm test --workspace=@sunset/web
        env:
          TEST_DATABASE_URL: postgres://sunset:sunset@localhost:5432/sunset_test
      - run: npm run build:worker --workspace=@sunset/web

  scorer:
    name: Scorer (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/scorer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: pytest -q

  images:
    name: Container images and Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker build --platform linux/amd64 -t sunset-scorer:ci services/scorer
      - run: docker compose config -q
      - run: docker compose -f deploy/droplet/compose.yaml config -q
        env:
          POSTGRES_PASSWORD: ci
          TUNNEL_TOKEN: ci
