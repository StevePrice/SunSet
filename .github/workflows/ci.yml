name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (lint, typecheck, test, Worker build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=@sunset/web
      - run: npm run typecheck --workspace=@sunset/web
      - run: npm test --workspace=@sunset/web
      - run: npm run build:worker --workspace=@sunset/web

  scorer:
    name: Scorer (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/scorer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: pytest -q

  images:
    name: Container images and Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker build --platform linux/amd64 -t sunset-scorer:ci services/scorer
      - run: docker compose config -q
      - run: docker compose -f deploy/droplet/compose.yaml config -q
        env:
          POSTGRES_PASSWORD: ci
          TUNNEL_TOKEN: ci
